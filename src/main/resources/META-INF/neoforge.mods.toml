modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="orevspelcompat" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="logo.png"
logoBlur=false
itemIcon="orevspelcompat:raw_platinum_nugget"
authors="BexLa"
description='''
Orevolution focuses on adding more value to the mining aspect of minecraft, doing so by adding new ores, rebalancing tools and implementing new mechanics for them.
'''

[[dependencies.orevspelcompat]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.orevspelcompat]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.orevspelcompat]]
    modId="blueprint"
    type="required"
    versionRange="[8.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.orevspelcompat]]
    modId="orevolution"
    type="required"
    versionRange="[6.0.0,)"
    ordering="AFTER"
    side="BOTH"
